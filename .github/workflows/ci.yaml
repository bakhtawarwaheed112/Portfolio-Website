name: ci-develop

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop


jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      - name: Install linters
        run: |
          npm install -g htmlhint stylelint stylelint-config-standard

      - name: Run HTMLHint
        run: htmlhint "src/**/*.html"

      - name: Run Stylelint
        run: stylelint "styles/**/*.css"
